<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 · Game-OS · 页面未找到</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background: #0b0b1a;
            font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
            min-height: 100vh;
            color: #f1f5f9;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            position: relative;
        }

        #particles {
            position: fixed;
            inset: 0;
            z-index: 0;
            pointer-events: none;
        }

        .particle {
            position: absolute;
            border-radius: 50%;
            animation: float linear infinite;
            opacity: 0;
        }

        @keyframes float {
            0% { transform: translateY(100vh) scale(0); opacity: 0; }
            10% { opacity: 1; }
            90% { opacity: 1; }
            100% { transform: translateY(-10vh) scale(1); opacity: 0; }
        }

        .container {
            position: relative;
            z-index: 1;
            text-align: center;
            max-width: 640px;
            padding: 40px 24px;
        }

        .error-code {
            font-size: clamp(100px, 20vw, 180px);
            font-weight: 900;
            line-height: 1;
            background: linear-gradient(135deg, #ef4444 0%, #f59e0b 40%, #a78bfa 70%, #06b6d4 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            letter-spacing: -4px;
            animation: glitch 4s ease-in-out infinite;
            position: relative;
        }

        @keyframes glitch {
            0%, 90%, 100% { transform: translate(0); text-shadow: none; }
            92% { transform: translate(-2px, 1px); }
            94% { transform: translate(2px, -1px); }
            96% { transform: translate(-1px, 2px); }
            98% { transform: translate(1px, -2px); }
        }

        .error-code::before,
        .error-code::after {
            content: '404';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            -webkit-background-clip: text;
            background-clip: text;
        }

        .error-code::before {
            color: rgba(239, 68, 68, 0.4);
            -webkit-text-fill-color: rgba(239, 68, 68, 0.4);
            animation: glitchShift1 4s ease-in-out infinite;
            clip-path: inset(0 0 70% 0);
        }

        .error-code::after {
            color: rgba(6, 182, 212, 0.4);
            -webkit-text-fill-color: rgba(6, 182, 212, 0.4);
            animation: glitchShift2 4s ease-in-out infinite;
            clip-path: inset(70% 0 0 0);
        }

        @keyframes glitchShift1 {
            0%, 90%, 100% { transform: translate(0); }
            92% { transform: translate(-3px, -1px); }
            96% { transform: translate(3px, 1px); }
        }

        @keyframes glitchShift2 {
            0%, 90%, 100% { transform: translate(0); }
            93% { transform: translate(3px, 1px); }
            97% { transform: translate(-3px, -1px); }
        }

        .badge {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: rgba(239, 68, 68, 0.12);
            border: 1px solid rgba(239, 68, 68, 0.3);
            border-radius: 20px;
            padding: 6px 16px;
            font-size: 13px;
            color: #fca5a5;
            margin-bottom: 24px;
            letter-spacing: 0.5px;
        }

        .badge .dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: #ef4444;
            animation: pulse 1.5s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.5; transform: scale(1.5); }
        }

        h1 {
            font-size: 28px;
            font-weight: 700;
            margin-bottom: 12px;
            color: #f1f5f9;
        }

        .subtitle {
            font-size: 15px;
            color: rgba(255, 255, 255, 0.5);
            line-height: 1.7;
            margin-bottom: 40px;
        }

        .threshold-bar {
            display: flex;
            align-items: center;
            gap: 0;
            max-width: 360px;
            margin: 0 auto 36px;
            height: 6px;
            border-radius: 3px;
            overflow: hidden;
            background: rgba(255,255,255,0.06);
        }

        .threshold-bar .seg {
            height: 100%;
            position: relative;
        }

        .threshold-bar .seg.green { background: #22c55e; flex: 0.48; }
        .threshold-bar .seg.yellow { background: #f59e0b; flex: 0.02; }
        .threshold-bar .seg.red { background: #ef4444; flex: 0.18; }
        .threshold-bar .seg.off { background: rgba(255,255,255,0.04); flex: 0.32; }

        .threshold-bar .marker {
            position: absolute;
            top: -4px;
            width: 2px;
            height: 14px;
            background: #f1f5f9;
            border-radius: 1px;
        }

        .threshold-bar .marker.m1 { left: 48%; }
        .threshold-bar .marker.m2 { left: 50%; background: #f59e0b; }
        .threshold-bar .marker.m3 { left: 68%; }

        .threshold-labels {
            display: flex;
            justify-content: space-between;
            max-width: 360px;
            margin: 8px auto 0;
            font-size: 11px;
            color: rgba(255,255,255,0.35);
        }

        .nav-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
            max-width: 440px;
            margin: 0 auto 32px;
        }

        .nav-card {
            display: flex;
            align-items: center;
            gap: 12px;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 12px;
            padding: 14px 16px;
            text-decoration: none;
            color: #f1f5f9;
            transition: all 0.25s ease;
            text-align: left;
        }

        .nav-card:hover {
            background: rgba(167, 139, 250, 0.08);
            border-color: rgba(167, 139, 250, 0.3);
            transform: translateY(-2px);
            box-shadow: 0 8px 24px rgba(167, 139, 250, 0.1);
        }

        .nav-card .icon {
            width: 40px;
            height: 40px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            flex-shrink: 0;
        }

        .nav-card.console .icon { background: rgba(167, 139, 250, 0.15); }
        .nav-card.mixology .icon { background: rgba(245, 158, 11, 0.15); }
        .nav-card.sandbox .icon { background: rgba(6, 182, 212, 0.15); }
        .nav-card.labs .icon { background: rgba(34, 197, 94, 0.15); }

        .nav-card .info { flex: 1; min-width: 0; }
        .nav-card .label { font-size: 14px; font-weight: 600; margin-bottom: 2px; }
        .nav-card .desc { font-size: 12px; color: rgba(255,255,255,0.4); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

        .back-btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: rgba(255,255,255,0.06);
            border: 1px solid rgba(255,255,255,0.12);
            border-radius: 10px;
            padding: 10px 24px;
            color: #f1f5f9;
            text-decoration: none;
            font-size: 14px;
            font-weight: 500;
            transition: all 0.2s;
            cursor: pointer;
        }

        .back-btn:hover {
            background: rgba(167, 139, 250, 0.15);
            border-color: rgba(167, 139, 250, 0.4);
        }

        .footer {
            position: fixed;
            bottom: 20px;
            left: 0;
            right: 0;
            text-align: center;
            font-size: 11px;
            color: rgba(255,255,255,0.2);
            z-index: 1;
        }

        .footer span { color: rgba(167, 139, 250, 0.5); }

        @media (max-width: 480px) {
            .nav-grid { grid-template-columns: 1fr; }
            h1 { font-size: 22px; }
        }
    </style>
</head>
<body>
    <div id="particles"></div>

    <div class="container">
        <div class="badge">
            <span class="dot"></span>
            熔断线已触发 · 信号丢失
        </div>

        <div class="error-code">404</div>

        <h1>页面路径越界 · 超出有效域</h1>
        <p class="subtitle">
            您访问的坐标不在 Game-OS 有效导航域内。<br>
            可能是链接过期、路径拼写错误，或该模块尚未部署。<br>
            系统已自动记录此 404 事件用于路由优化。
        </p>

        <div class="threshold-bar">
            <div class="seg green"></div>
            <div class="seg yellow"></div>
            <div class="seg red"></div>
            <div class="seg off"></div>
            <div class="marker m1"></div>
            <div class="marker m2"></div>
            <div class="marker m3"></div>
        </div>
        <div class="threshold-labels">
            <span>0.48 有效域</span>
            <span>0.50 稳态</span>
            <span>0.68 熔断</span>
            <span>1.0 无效</span>
        </div>

        <div style="height: 32px;"></div>

        <div class="nav-grid">
            <a id="nav-home" href="/index.html" class="nav-card console">
                <div class="icon">🏛️</div>
                <div class="info">
                    <div class="label">总控台</div>
                    <div class="desc">Y.Mine · 数理操作系统</div>
                </div>
            </a>
            <a id="nav-mixology" href="/labs/molecular-mixology.html" class="nav-card mixology">
                <div class="icon">🍸</div>
                <div class="info">
                    <div class="label">分子调酒实验室</div>
                    <div class="desc">圆锥浓度模型 · Remotion视频</div>
                </div>
            </a>
            <a id="nav-sandbox" href="/labs/evidence/ultimate-sandbox.html" class="nav-card sandbox">
                <div class="icon">⚡</div>
                <div class="info">
                    <div class="label">终极沙盘</div>
                    <div class="desc">人性×机器×市场</div>
                </div>
            </a>
            <a id="nav-studio" href="/ymine-studio.html" class="nav-card labs">
                <div class="icon">🎯</div>
                <div class="info">
                    <div class="label">YMine Studio</div>
                    <div class="desc">十步闭环全功能控制</div>
                </div>
            </a>
        </div>

        <a href="javascript:history.back()" class="back-btn">← 返回上一页</a>
    </div>

    <div class="footer">
        KMP→IPD→七维向量→THRESHOLDS→01解码 · <span>Game-OS</span> · 熔断保护已激活
    </div>

    <script>
        (function() {
            var path = window.location.pathname;
            var base = '';
            var m = path.match(/^\/([^/]+)\//);
            if (m && m[1] && m[1] !== 'labs' && m[1] !== 'engines' && m[1] !== 'game-os-main' && m[1] !== 'MemoryBase' && m[1] !== 'models' && m[1] !== 'assets' && m[1] !== 'ms-lab' && m[1] !== 'moodmind_lab' && m[1] !== 'isomorphism-block-engine' && m[1] !== 'tests' && m[1] !== 'video') {
                base = '/' + m[1];
            }
            var links = {
                'nav-home': base + '/index.html',
                'nav-mixology': base + '/labs/molecular-mixology.html',
                'nav-sandbox': base + '/labs/evidence/ultimate-sandbox.html',
                'nav-studio': base + '/ymine-studio.html'
            };
            Object.keys(links).forEach(function(id) {
                var el = document.getElementById(id);
                if (el) el.href = links[id];
            });

            var container = document.getElementById('particles');
            var colors = ['rgba(167,139,250,0.3)', 'rgba(245,158,11,0.2)', 'rgba(6,182,212,0.2)', 'rgba(239,68,68,0.15)', 'rgba(34,197,94,0.15)'];
            for (var i = 0; i < 40; i++) {
                var p = document.createElement('div');
                p.className = 'particle';
                var size = Math.random() * 3 + 1;
                p.style.width = size + 'px';
                p.style.height = size + 'px';
                p.style.left = Math.random() * 100 + '%';
                p.style.background = colors[Math.floor(Math.random() * colors.length)];
                p.style.animationDuration = (Math.random() * 8 + 6) + 's';
                p.style.animationDelay = (Math.random() * 10) + 's';
                container.appendChild(p);
            }
        })();
    </script>
</body>
</html>
